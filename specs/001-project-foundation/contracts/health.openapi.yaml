openapi: "3.1.0"

info:
  title: Saouti — Foundation API
  version: "0.1.0"
  description: |
    API surface for the project foundation epic (001-project-foundation).
    Only the health-check endpoint is defined here.
    All future endpoints (auth, profile, generation) are defined in their respective epic contracts.

servers:
  - url: http://localhost:3000
    description: Local development

paths:
  /health:
    get:
      operationId: getHealth
      summary: System health check
      description: |
        Returns the live status of the application and its external dependencies.
        Used by Docker Compose healthchecks, load balancers, and developer verification.
        This endpoint MUST NOT require authentication.
        This endpoint MUST NOT log request bodies or sensitive headers.
      tags:
        - Infrastructure
      responses:
        "200":
          description: All dependencies are reachable and healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: "ok"
                timestamp: "2026-10-22T22:44:00.000Z"
                version: "0.1.0"
                services:
                  database:
                    status: "ok"
                    latencyMs: 3
                  queue:
                    status: "ok"
                    latencyMs: 1
                  worker:
                    status: "ok"
                    lastHeartbeatAt: "2026-10-22T22:43:55.000Z"
        "503":
          description: |
            One or more dependencies are unreachable. The response body still follows
            the HealthResponse schema so clients can identify which service is failing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: "degraded"
                timestamp: "2026-10-22T22:44:00.000Z"
                version: "0.1.0"
                services:
                  database:
                    status: "error"
                    error: "Connection refused"
                    latencyMs: null
                  queue:
                    status: "ok"
                    latencyMs: 1
                  worker:
                    status: "unknown"
                    lastHeartbeatAt: null

components:
  schemas:
    HealthStatus:
      type: string
      enum: [ok, degraded, error, unknown]
      description: |
        - ok: dependency is reachable and responding normally
        - degraded: dependency is reachable but responding slowly or with errors
        - error: dependency is unreachable or returned an error
        - unknown: status cannot be determined (e.g., worker hasn't checked in yet)

    ServiceHealth:
      type: object
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        latencyMs:
          type: [integer, "null"]
          description: Round-trip latency in milliseconds for the health probe. Null if unreachable.
          example: 3
        error:
          type: string
          description: Human-readable error message if status is error or degraded.
          example: "Connection refused"
        lastHeartbeatAt:
          type: [string, "null"]
          format: date-time
          description: >
            (Worker only) ISO 8601 timestamp of the last worker heartbeat job completion.
            Null if the worker has not yet processed a heartbeat since startup.

    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - version
        - services
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
          description: Aggregate status. "ok" only if all services are ok.
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp when this response was generated.
          example: "2026-10-22T22:44:00.000Z"
        version:
          type: string
          description: Application version from package.json.
          example: "0.1.0"
        services:
          type: object
          required:
            - database
            - queue
            - worker
          properties:
            database:
              $ref: "#/components/schemas/ServiceHealth"
              description: PostgreSQL connectivity probe (simple SELECT 1).
            queue:
              $ref: "#/components/schemas/ServiceHealth"
              description: Redis connectivity probe (PING command).
            worker:
              $ref: "#/components/schemas/ServiceHealth"
              description: >
                Worker liveness via Redis heartbeat key. The worker writes a timestamp
                to a Redis key on each heartbeat job completion; the app reads it here.
